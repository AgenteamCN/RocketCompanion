[package]
name = "rocketsim"
version = "0.3.5"
edition = "2024"
license = "MIT"
description = "RocketSim v3-rust physics engine core with WebAssembly C-ABI extensions"

[dependencies]
arrayvec = "0.7.6"
byteorder = "1.5.0"
fastrand = "2.3.0"
fern = "0.7.1"
glam.workspace = true
log = "0.4.29"
rustc-hash.workspace = true
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde", "glam/serde"]

